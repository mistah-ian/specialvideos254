<!DOCTYPE html>

<html lang="en">

  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow">

    <title>Special Videos 254</title>
    
    <meta name="description" content="Special Videos 254"> 

    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon.png"/>
    <link rel="icon" type="image/png" sizes="48x48" href="/images/favicon-48x48.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png"/>
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png"/>

    <link rel="stylesheet" href="/index.css">

  </head>

  <body>

    <div class="search-bar">

      <button id="search-bar-btn">
        <span class="search-bar-btn-title">All Models</span>
        <span class="search-bar-btn-icon">&#9660;</span>
      </button>

      <div id="search-bar-options">
        <div class="search-bar-options-item" data-model-id="all">
          <p class="search-bar-options-item-title">All Models</p>
          <p class="search-bar-options-item-desc">Show all available content</p>
        </div>
      </div>

    </div>

    <div id="models-wrapper"></div>

    <div id="video-modal">

      <div class="video-modal-close">
        <button id="video-modal-close-btn">&times;</button>
      </div>

      <h2 class="video-modal-model-name"></h2>

      <div class="video-modal-videos-container">

        <div class="video-modal-videos-container-main-video-div">

          <video controls controlslist="nodownload nopictureinpicture nofullscreen" disablepictureinpicture playsinline>
            <source src="" type="video/mp4">
          </video>
          <p class="video-modal-main-video-title"></p>

          <div id="paywall-modal">

            <div class="paywall-modal-content-details">
              <p class="paywall-modal-content-details-unlock-text">Unlock the full video.</p>
              <p class="paywall-modal-content-details-phone-number-text">Phone Number</p>
              <input type="tel" id="paywall-modal-content-details-phone-number-input" placeholder="0XXXXXXXXX" autocomplete="tel" autocorrect="off" autocapitalize="off" spellcheck="false"/>
              <p class="paywall-modal-content-details-phone-number-invalid-error">*Invalid Phone Number*</p>
              <button type="button" id="paywall-modal-content-details-pay-btn">Pay KES 1.00</button>
            </div>

            <div class="paywall-modal-content-please-wait">
              <p class="paywall-modal-content-please-wait-text">Please wait while we confirm your payment...</p>
              <div class="paywall-modal-content-please-wait-spinner"></div>
            </div>

          </div>

        </div>

        <div class="video-modal-videos-container-other-videos-div">

          <div class="video-modal-videos-container-other-videos-div-individual">
            <video controls controlslist="nodownload nopictureinpicture nofullscreen" disablepictureinpicture playsinline>
              <source src="" type="video/mp4">
            </video>
            <p class="video-modal-other-video-title"></p>
          </div>

        </div>

      </div>

    </div>

  </body>

  <script src="/index.js"></script>
  
</html>
