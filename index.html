<!DOCTYPE html>

<html lang="en">

  <head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="robots" content="noindex, nofollow">

    <title>Special Videos 254</title>
    
    <meta name="description" content="Special Videos 254"> 

    <link rel="stylesheet" href="/index.css">

  </head>

  <body>

    <div class="search-bar">

      <button id="search-bar-btn">
        <span class="search-bar-btn-title">All Models</span>
        <span class="search-bar-btn-icon">&#9660;</span>
      </button>

      <div id="search-bar-options">
        <div class="search-bar-options-item">
          <p class="search-bar-options-item-title"></p>
          <p class="search-bar-options-item-desc"></p>
        </div>
      </div>

    </div>

    <div class="model-complete">

      <h2 class="model-name"></h2>

      <div class="videos-container">

        <div class="videos-container-individual">
          <video controls controlslist="nodownload nopictureinpicture nofullscreen" disablepictureinpicture playsinline>
            <source src="" type="video/mp4">
          </video>
          <p class="video-title"></p>
        </div>

      </div>

    </div> 

    <div id="video-modal">
      <div class="video-modal-close">
        <button id="video-modal-close-btn">&times;</button>
      </div>

      <div class="video-modal-video-container">
        <div class="video-modal-video-container-previous">
          <button id="video-modal-video-container-previous-btn">&lsaquo;</button>
        </div>

        <video controls controlslist="nodownload nopictureinpicture nofullscreen" disablepictureinpicture playsinline>
          <source src="" type="video/mp4">
        </video>

        <div class="video-modal-video-container-next">
          <button id="video-modal-video-container-next-btn">&rsaquo;</button>
        </div>
      </div>
    </div>

    <div id="paywall-modal">

      <div class="paywall-modal-content">
        <div class="paywall-modal-content-close">
          <button id="paywall-modal-content-close-btn">&times;</button>
        </div>

        <div class="paywall-modal-content-details">
          <p class="paywall-modal-content-details-unlock-text">Unlock the full video.</p>
          <p class="paywall-modal-content-details-phone-number-text">Phone Number</p>
          <input type="tel" id="paywall-modal-content-details-phone-number-input" placeholder="0X-XXX-XXX-XX" autocomplete="tel" autocorrect="off" autocapitalize="off" spellcheck="false"/>
          <p class="paywall-modal-content-details-phone-number-invalid-error">*Invalid Phone Number*</p>
          <button type="button" id="paywall-modal-content-details-pay-btn">Pay KES 1.00</button>
        </div>

        <div class="paywall-modal-content-please-wait">
          <p class="paywall-modal-content-please-wait-text">Please wait while we confirm your payment...</p>
          <div class="paywall-modal-content-please-wait-spinner"></div>
        </div>
      </div>

    </div>

  </body>

  <script src="/index.js"></script>
  
</html>
